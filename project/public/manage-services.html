<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Services - Elon Studio Salon Admin</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-light">
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="admin-dashboard.html">
          <span class="text-gold">Elon</span>Studio Salon
          <span class="badge bg-secondary fs-6 ms-1">Admin</span>
        </a>
        <div>
          <a
            href="admin-dashboard.html"
            class="btn btn-outline-light btn-sm me-2"
          >
            <i class="bi bi-arrow-left me-1"></i> Dashboard
          </a>
          <button class="btn btn-danger btn-sm" id="logoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="container pb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h3 class="mb-0 fw-bold text-dark">Manage Services</h3>
          <p class="text-muted small mb-0">
            Add, edit, or remove salon offerings and pricing.
          </p>
        </div>
        <button
          class="btn btn-dark btn-sm px-3"
          data-bs-toggle="modal"
          data-bs-target="#serviceModal"
          onclick="openCreateModal()"
        >
          <i class="bi bi-plus-lg me-1"></i> Add New Service
        </button>
      </div>

      <div id="alertBox" class="alert d-none" role="alert"></div>

      <!-- Services Table -->
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-striped table-hover mb-0 align-middle">
              <thead class="table-dark">
                <tr>
                  <th style="width: 25%">Name</th>
                  <th style="width: 15%">Price (₹)</th>
                  <th style="width: 15%">Duration</th>
                  <th style="width: 30%">Description</th>
                  <th style="width: 15%" class="text-center">Actions</th>
                </tr>
              </thead>
              <tbody id="servicesTableBody">
                <tr>
                  <td colspan="5" class="text-center py-4 text-muted">
                    <div
                      class="spinner-border spinner-border-sm me-2 text-dark"
                      role="status"
                    ></div>
                    Loading services...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- ================= ADD / EDIT SERVICE MODAL ================= -->
    <div class="modal fade" id="serviceModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <form id="serviceForm">
            <div class="modal-header bg-dark text-white">
              <h5 class="modal-title fw-bold" id="serviceModalTitle">
                Add New Service
              </h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body p-4">
              <input type="hidden" id="serviceId" />

              <div class="mb-3">
                <label for="serviceName" class="form-label fw-semibold"
                  >Service Name <span class="text-danger">*</span></label
                >
                <input
                  type="text"
                  class="form-control"
                  id="serviceName"
                  placeholder="e.g. Premium Haircut & Styling"
                  required
                />
              </div>

              <div class="row">
                <div class="col-md-6 mb-3">
                  <label for="servicePrice" class="form-label fw-semibold"
                    >Price (₹) <span class="text-danger">*</span></label
                  >
                  <input
                    type="number"
                    min="0"
                    step="0.01"
                    class="form-control"
                    id="servicePrice"
                    placeholder="499.00"
                    required
                  />
                </div>
                <div class="col-md-6 mb-3">
                  <label for="serviceDuration" class="form-label fw-semibold"
                    >Duration</label
                  >
                  <input
                    type="text"
                    class="form-control"
                    id="serviceDuration"
                    placeholder="e.g. 45 Min"
                  />
                </div>
              </div>

              <div class="mb-3">
                <label for="serviceDescription" class="form-label fw-semibold"
                  >Description</label
                >
                <textarea
                  class="form-control"
                  id="serviceDescription"
                  rows="3"
                  placeholder="Brief details about what is included in this service..."
                ></textarea>
              </div>
            </div>
            <div class="modal-footer bg-light">
              <button
                type="button"
                class="btn btn-outline-secondary"
                data-bs-dismiss="modal"
              >
                Cancel
              </button>
              <button
                type="submit"
                class="btn btn-dark px-4"
                id="serviceSaveBtn"
              >
                Save Service
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/manage-services.js"></script>
  </body>
</html>
