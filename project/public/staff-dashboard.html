<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Staff Dashboard - Elon Studio Salon</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
    />
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-light">
    <!-- ================= NAVBAR ================= -->
    <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">
          <span class="text-gold">Elon</span>Studio Salon
          <span class="badge bg-secondary fs-6 ms-1">Staff Panel</span>
        </a>
        <div class="d-flex align-items-center gap-3">
          <span class="text-white small fw-semibold" id="staffNameLabel"></span>
          <button class="btn btn-danger btn-sm" id="logoutBtn">
            <i class="bi bi-box-arrow-right me-1"></i> Logout
          </button>
        </div>
      </div>
    </nav>

    <!-- ================= MAIN CONTENT ================= -->
    <div class="container pb-5">
      <div class="mb-4">
        <h3 class="fw-bold text-dark mb-1">My Appointments</h3>
        <p class="text-muted small">
          Only appointments assigned to you are displayed here.
        </p>
      </div>

      <div id="alertBox" class="alert d-none" role="alert"></div>

      <!-- Quick Stats -->
      <div class="row g-3 mb-4">
        <div class="col-md-3 col-6">
          <div class="card shadow-sm border-0 text-center p-3 h-100">
            <h6 class="text-muted small fw-semibold mb-1">Pending</h6>
            <h4 class="fw-bold text-warning mb-0" id="statPending">0</h4>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="card shadow-sm border-0 text-center p-3 h-100">
            <h6 class="text-muted small fw-semibold mb-1">Confirmed</h6>
            <h4 class="fw-bold text-info mb-0" id="statConfirmed">0</h4>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="card shadow-sm border-0 text-center p-3 h-100">
            <h6 class="text-muted small fw-semibold mb-1">Completed</h6>
            <h4 class="fw-bold text-success mb-0" id="statCompleted">0</h4>
          </div>
        </div>
        <div class="col-md-3 col-6">
          <div class="card shadow-sm border-0 text-center p-3 h-100">
            <h6 class="text-muted small fw-semibold mb-1">No-Show</h6>
            <h4 class="fw-bold text-danger mb-0" id="statNoShow">0</h4>
          </div>
        </div>
      </div>

      <!-- Appointments Table -->
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table
              class="table table-striped table-hover mb-0 text-center align-middle"
            >
              <thead class="table-dark">
                <tr>
                  <th>Customer</th>
                  <th>Phone</th>
                  <th>Service</th>
                  <th>Date & Time</th>
                  <th>Status</th>
                  <th>Actions</th>
                </tr>
              </thead>
              <tbody id="myAppointmentsTableBody">
                <tr>
                  <td colspan="6" class="text-center py-4 text-muted">
                    <div
                      class="spinner-border spinner-border-sm me-2 text-dark"
                      role="status"
                    ></div>
                    Loading your appointments...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="assets/js/staff-dashboard.js"></script>
  </body>
</html>
